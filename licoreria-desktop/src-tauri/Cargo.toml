[package]
name = "licoreria-desktop"
version = "1.0.0"
description = "Sistema Licorería - Desktop App"
authors = ["Sistema Licorería"]
edition = "2021"

[lib]
name = "licoreria_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
