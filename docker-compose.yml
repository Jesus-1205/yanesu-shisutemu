name: yanesu-shisutemu

services:
  # PostgreSQL — base de datos principal
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yanesu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-licoreria}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yanesu} -d ${POSTGRES_DB:-licoreria}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - yanesu_net

  # Backend FastAPI — imágenes pre-construidas desde GHCR
  backend:
    image: ghcr.io/jesus-1205/sistema_inventario_local-backend:master
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yanesu}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-licoreria}
      SECURE_COOKIE: ${SECURE_COOKIE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DATA_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - yanesu_data:/data
    networks:
      - yanesu_net

  # Frontend React + nginx — imágenes pre-construidas desde GHCR
  nginx:
    image: ghcr.io/jesus-1205/sistema_inventario_local-frontend:master
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - yanesu_net

  # n8n — automatizaciones e integraciones (BCV, Telegram)
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_BIND_PORT:-127.0.0.1:5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/Caracas
      - TZ=America/Caracas
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - yanesu_net

volumes:
  pgdata:
  yanesu_data:
  n8n_data:

networks:
  yanesu_net:
    driver: bridge
