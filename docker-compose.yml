volumes:
  postgres_data:
  pgadmin_data:

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: licoreria_admin
      POSTGRES_PASSWORD: licoreria_1234
      POSTGRES_DB: licoreria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licoreria_admin -d licoreria"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: f13b07527bcf8092d63f4dcc9536985d1effbb4ab93de0eb4be5d8afb1bf4cef
      POSTGRES_USER: licoreria_admin
      POSTGRES_PASSWORD: licoreria_1234
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: licoreria
    ports:
      - "8000:8000"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
