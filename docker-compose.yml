name: yanesu-shisutemu

services:
  # PostgreSQL — base de datos principal
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yanesu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-licoreria}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yanesu} -d ${POSTGRES_DB:-licoreria}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - yanesu_net

  # Backend FastAPI — imágenes pre-construidas desde GHCR
  backend:
    image: ghcr.io/jesus-1205/yanesu-shisutemu-backend:main
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yanesu}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-licoreria}
      SECURE_COOKIE: ${SECURE_COOKIE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      DATA_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - yanesu_data:/data
    networks:
      - yanesu_net

  # Frontend React + nginx — imágenes pre-construidas desde GHCR
  nginx:
    image: ghcr.io/jesus-1205/yanesu-shisutemu-frontend:main
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - yanesu_net

volumes:
  pgdata:
  yanesu_data:

networks:
  yanesu_net:
    driver: bridge
